    order_summary:
      step: _sidebar
      weight: 7
      view: null
    customer_comments:
      step: _disabled
      weight: 8
    completion_register:
      step: _disabled
      weight: 9
    login:
      step: _disabled
      weight: 10
      allow_guest_checkout: true
      allow_registration: false
